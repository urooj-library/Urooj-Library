/* slim modern */
:root{--spacing:.215rem;--radius-sm:.2rem;--radius-lg:.45rem;--radius-xl:.6rem;--radius-2xl:.8rem;--radius-3xl:1rem;
--text-xs:.69rem;--text-sm:.79rem;--text-base:.9rem;--text-lg:1rem;--text-xl:1.1rem;--text-2xl:1.3rem;--text-3xl:1.6rem;--text-4xl:1.9rem;
--card-shadow:0 0 0 1px #0f172a0d;--bg:#f6f7fa}
body{font-size:14px;letter-spacing:-.005em}
#root header,#root .topbar{min-height:0}
#root .shadow-sm,#root .shadow,#root .shadow-md,#root .shadow-lg{box-shadow:0 0 0 1px var(--line)!important}
#root .border-b{border-color:color-mix(in oklab,var(--line) 70%,transparent)}
.fixed.bottom-0.left-0.right-0{height:3.2rem!important;box-shadow:0 -1px 0 var(--line)}
.fixed.bottom-0.left-0.right-0 svg{width:18px;height:18px}
.fixed.bottom-0.left-0.right-0 span,.fixed.bottom-0.left-0.right-0 div{font-size:10px}
button,input,select,textarea{font-size:inherit}
input,select,textarea{min-height:0}
header{height:3rem!important;gap:.5rem!important}
header>button{min-height:0!important;height:1.9rem!important;padding:0 .6rem!important;font-size:.7rem!important;gap:.25rem!important;border-radius:.6rem!important}
header>button svg{width:13px;height:13px}
header>button{display:none!important}
nav.fixed.bottom-0{grid-template-columns:1fr 1fr 64px 1fr 1fr!important}
nav.fixed.bottom-0>:nth-child(3){grid-column:4}
nav.fixed.bottom-0>:nth-child(4){grid-column:5}
nav.fixed.bottom-0>:nth-child(5){display:none}
#kb-fab{position:fixed;left:50%;bottom:calc(1.55rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;width:3.5rem;height:3.5rem;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 18px -4px color-mix(in oklab,var(--accent) 60%,transparent);cursor:pointer;padding:0}
#kb-fab:active{transform:translateX(-50%) scale(.94)}
#kb-fab[hidden]{display:none}
header>button span{max-width:none!important}

/* mobile layout on every screen */
html{background:color-mix(in oklab,var(--bg,#f3f4f9) 88%,#000)}
body{margin:0}
#root{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg,#f3f4f9);position:relative;box-shadow:0 0 0 1px var(--line,#0000001a),0 0 60px #00000026}
.fixed.bottom-0.left-0.right-0{left:50%!important;right:auto!important;width:min(100%,480px);transform:translateX(-50%)}
